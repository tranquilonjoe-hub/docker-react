services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: react3
    ports:
      - "3000:3000"
    volumes:
      - /app/node_modules
      - .:/app
  tests:
    build:
     context: .
     dockerfile: Dockerfile.dev
    container_name: test1
    volumes:
      - /app/node_modules
      - .:/app
    command: ["npm", "run", "test"]


